services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: ifascada-timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-rustscada}
      POSTGRES_HOST_AUTH_METHOD: ${POSTGRES_HOST_AUTH_METHOD:-scram-sha-256}
    ports:
      - "${PG_PORT:-55432}:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
      - ./crates/central-server/migrations/0001_core_postgres.sql:/docker-entrypoint-initdb.d/0001_core_postgres.sql:ro
      - ./crates/central-server/migrations/0002_timescale_historian.sql:/docker-entrypoint-initdb.d/0002_timescale_historian.sql:ro
      - ./crates/central-server/migrations/0003_tag_naming_governance.sql:/docker-entrypoint-initdb.d/0003_tag_naming_governance.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rustscada -h 127.0.0.1 -p 5432"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ifascada-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-56379}:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: ifascada-mosquitto
    restart: unless-stopped
    ports:
      - "${MQTT_PORT_EXTERNAL:-51883}:1883"
    volumes:
      - ./docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ifascada-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@ifascada.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "${PGADMIN_PORT:-58080}:80"
    depends_on:
      - timescaledb
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  db-seed:
    image: postgres:16-alpine
    container_name: ifascada-db-seed
    profiles: ["seed"]
    restart: "no"
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      PG_DSN: ${CENTRAL_PG_DSN_INTERNAL:-host=timescaledb port=5432 user=postgres dbname=rustscada sslmode=disable}
      SEED_PROFILE: ${SEED_PROFILE:-minimal}
    volumes:
      - ./crates/central-server/migrations:/migrations:ro
      - ./docker/db-seed.sh:/scripts/db-seed.sh:ro
    command: ["/bin/sh", "/scripts/db-seed.sh"]

  central-server:
    build:
      context: .
      dockerfile: docker/central-server.Dockerfile
    container_name: ifascada-central-server
    profiles: ["central"]
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
      mosquitto:
        condition: service_started
    environment:
      RUST_LOG: ${RUST_LOG:-info,central_server=debug}
      CENTRAL_MQTT_ENABLED: ${CENTRAL_MQTT_ENABLED:-true}
      CENTRAL_API_ENABLED: ${CENTRAL_API_ENABLED:-true}
      CENTRAL_API_BIND: 0.0.0.0:8088
      MQTT_HOST: ${MQTT_HOST_INTERNAL:-mosquitto}
      MQTT_PORT: ${MQTT_PORT_INTERNAL:-1883}
      CENTRAL_MQTT_CLIENT_ID: ${CENTRAL_MQTT_CLIENT_ID:-central-server-01}
      CENTRAL_MQTT_TOPIC_FILTERS: ${CENTRAL_MQTT_TOPIC_FILTERS:-scada/+/edge/+/#}
      CENTRAL_PG_DSN: ${CENTRAL_PG_DSN_INTERNAL:-host=timescaledb port=5432 user=postgres dbname=rustscada sslmode=disable}
      CENTRAL_REDIS_ENABLED: ${CENTRAL_REDIS_ENABLED:-true}
      CENTRAL_REDIS_URL: ${CENTRAL_REDIS_URL_INTERNAL:-redis://redis:6379/}
      CENTRAL_REDIS_EVENT_CHANNEL: ${CENTRAL_REDIS_EVENT_CHANNEL:-scada:rt:events}
      CENTRAL_REDIS_KEY_TTL_SECS: ${CENTRAL_REDIS_KEY_TTL_SECS:-300}
      CENTRAL_EDGE_ENROLL_TOKEN: ${CENTRAL_EDGE_ENROLL_TOKEN:-dev-edge-enroll-token}
      CENTRAL_EDGE_CONFIG_SIGNING_SECRET: ${CENTRAL_EDGE_CONFIG_SIGNING_SECRET:-dev-edge-config-signing-secret}
      CENTRAL_EDGE_CONFIG_SIGNING_KEY_ID: ${CENTRAL_EDGE_CONFIG_SIGNING_KEY_ID:-v1}
      CENTRAL_EDGE_RUNTIME_CONFIG_PATH: /app/config/bootstrap.example.json
    volumes:
      - ./crates/edge-agent/config:/app/config:ro
    ports:
      - "${CENTRAL_API_PORT:-8088}:8088"

  web-ui-v2:
    build:
      context: .
      dockerfile: web-ui-v2/Dockerfile
    container_name: ifascada-web-ui-v2
    profiles: ["v2"]
    restart: unless-stopped
    environment:
      CENTRAL_API_UPSTREAM: http://central-server:8088
    ports:
      - "3002:3002"

volumes:
  timescaledb_data:
  redis_data:
  mosquitto_data:
  mosquitto_log:
  pgadmin_data:
