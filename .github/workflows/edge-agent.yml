name: edge-agent

on:
  push:
    tags:
      - 'edge-v*'

jobs:
  build:
    runs-on: [self-hosted, windows, ifascada]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure cargo is on PATH
        shell: pwsh
        run: |
          # The self-hosted runner service runs as NT AUTHORITY\NETWORK SERVICE, whose own
          # %USERPROFILE% is C:\Windows\ServiceProfiles\NetworkService -- not the interactive
          # user's profile where rustup actually installed cargo. A machine-wide PATH change
          # also wouldn't reach it: services.exe only rereads system PATH at boot. So point at
          # the real cargo location explicitly instead of relying on runner host state.
          "C:\Users\MATHIASHA\.cargo\bin" >> $env:GITHUB_PATH

      - name: Extract version from tag
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag -replace '^edge-v', ''
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Verify tag actually touches edge-agent
        shell: pwsh
        run: |
          $prevTag = git describe --tags --abbrev=0 --match "edge-v*" "${{ github.ref_name }}^" 2>$null
          if (-not $prevTag) {
            Write-Output "No previous edge-v* tag found -- treating this as the first release, nothing to compare against."
            exit 0
          }
          $changed = git diff --name-only "$prevTag" "${{ github.ref_name }}"
          $relevant = $changed | Where-Object { $_ -match '^(crates/(domain|application|infrastructure|edge-agent)/|Cargo\.(toml|lock)$|deploy/edge-1\.0\.0-runtime/)' }
          if (-not $relevant) {
            Write-Error "Tag ${{ github.ref_name }} does not change anything relevant to edge-agent since $prevTag -- refusing to build/release a no-op release."
            exit 1
          }
          Write-Output "Relevant changes since $prevTag :"
          $relevant | ForEach-Object { Write-Output " - $_" }

      - name: Run tests
        shell: pwsh
        run: |
          cargo check --package edge-agent
          cargo test --package edge-agent

      - name: Build release binary
        shell: pwsh
        run: |
          cargo build --release --package edge-agent

      - name: Build release package
        shell: pwsh
        run: |
          ./deploy/edge-1.0.0-runtime/scripts/build-edge-package.ps1 `
            -BinaryPath "target/release/edge-agent.exe" `
            -OutputRoot "edge-package" `
            -Version "${{ steps.version.outputs.version }}" `
            -ConfigSchemaVersion 1 `
            -MinimumCentralVersion "1.0.0"

      - name: Zip the package
        shell: pwsh
        run: |
          Compress-Archive -Path "edge-package/*" -DestinationPath "edge-agent-${{ steps.version.outputs.version }}.zip"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: edge-agent-${{ steps.version.outputs.version }}.zip
