name: edge-agent

on:
  push:
    tags:
      - 'edge-v*'

jobs:
  build:
    runs-on: [self-hosted, windows, ifascada]
    # The auto-generated GITHUB_TOKEN defaults to read-only. Creating a release needs write
    # access to contents; without this, softprops/action-gh-release fails with a 403
    # "Resource not accessible by integration".
    permissions:
      contents: write
    env:
      # rustup resolves its config/toolchains via %USERPROFILE%\.rustup by default. The runner
      # service's own %USERPROFILE% (NT AUTHORITY\NETWORK SERVICE -> ServiceProfiles\NetworkService)
      # has no rustup install and no default toolchain, so cargo fails with "could not choose a
      # version of cargo to run" unless pointed explicitly at the real install.
      RUSTUP_HOME: C:\Users\MATHIASHA\.rustup
      CARGO_HOME: C:\Users\MATHIASHA\.cargo
      # This runner is also the interactive daily workstation (rust-analyzer, several VSCode
      # windows, Docker Desktop, etc. all compete for the same RAM). Building this workspace's
      # ~300 transitive deps with unlimited parallelism has driven the box into OOM territory
      # during real runs. Cap cargo's own parallelism to keep peak memory lower, at the cost of
      # a somewhat slower build.
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # This self-hosted runner reuses the same _work directory across runs (unlike
          # GitHub-hosted runners, which start clean every time). checkout's default clean=true
          # runs `git clean -ffdx`, which wipes target/ -- including the compiled artifacts for
          # ~300 dependency crates that never changed. Disabling it lets cargo's own fingerprint
          # tracking do its job: only recompile what our tagged commit actually touched.
          clean: false

      - name: Ensure cargo is on PATH
        shell: pwsh
        run: |
          # The self-hosted runner service runs as NT AUTHORITY\NETWORK SERVICE, whose own
          # %USERPROFILE% is C:\Windows\ServiceProfiles\NetworkService -- not the interactive
          # user's profile where rustup actually installed cargo. A machine-wide PATH change
          # also wouldn't reach it: services.exe only rereads system PATH at boot. So point at
          # the real cargo location explicitly instead of relying on runner host state.
          "C:\Users\MATHIASHA\.cargo\bin" >> $env:GITHUB_PATH

      - name: Extract version from tag
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag -replace '^edge-v', ''
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Verify tag actually touches edge-agent
        shell: pwsh
        run: |
          $prevTag = git describe --tags --abbrev=0 --match "edge-v*" "${{ github.ref_name }}^" 2>$null
          if (-not $prevTag) {
            Write-Output "No previous edge-v* tag found -- treating this as the first release, nothing to compare against."
            exit 0
          }
          $changed = git diff --name-only "$prevTag" "${{ github.ref_name }}"
          $relevant = $changed | Where-Object { $_ -match '^(crates/(domain|application|infrastructure|edge-agent)/|Cargo\.(toml|lock)$|deploy/edge-1\.0\.0-runtime/)' }
          if (-not $relevant) {
            Write-Error "Tag ${{ github.ref_name }} does not change anything relevant to edge-agent since $prevTag -- refusing to build/release a no-op release."
            exit 1
          }
          Write-Output "Relevant changes since $prevTag :"
          $relevant | ForEach-Object { Write-Output " - $_" }

      - name: Run tests
        shell: pwsh
        run: |
          cargo check --package edge-agent
          cargo test --package edge-agent
          # El supervisor viaja en el mismo paquete y es lo que la tarea programada lanza,
          # asi que se compila y se prueba en el mismo pipeline que el agente.
          cargo check --package edge-supervisor
          cargo test --package edge-supervisor

      - name: Run updater contract tests
        shell: pwsh
        run: |
          Invoke-Pester -Path "deploy/edge-1.0.0-runtime/tests/update-edge.Tests.ps1" -EnableExit

      - name: Build release binary
        shell: pwsh
        run: |
          cargo build --release --package edge-agent
          cargo build --release --package edge-supervisor

      - name: Build release package
        shell: pwsh
        run: |
          ./deploy/edge-1.0.0-runtime/scripts/build-edge-package.ps1 `
            -BinaryPath "target/release/edge-agent.exe" `
            -SupervisorPath "target/release/edge-supervisor.exe" `
            -OutputRoot "edge-package" `
            -Version "${{ steps.version.outputs.version }}" `
            -ConfigSchemaVersion 1 `
            -MinimumCentralVersion "1.0.0"

      - name: Zip the package
        shell: pwsh
        run: |
          Compress-Archive -Path "edge-package/*" -DestinationPath "edge-agent-${{ steps.version.outputs.version }}.zip"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: edge-agent-${{ steps.version.outputs.version }}.zip
