name: central-server

on:
  push:
    tags:
      - 'central-v*'

jobs:
  build:
    runs-on: [self-hosted, windows, ifascada]
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure cargo is on PATH
        shell: pwsh
        run: |
          # The self-hosted runner service runs as NT AUTHORITY\NETWORK SERVICE, whose own
          # %USERPROFILE% is C:\Windows\ServiceProfiles\NetworkService -- not the interactive
          # user's profile where rustup actually installed cargo. A machine-wide PATH change
          # also wouldn't reach it: services.exe only rereads system PATH at boot. So point at
          # the real cargo location explicitly instead of relying on runner host state.
          "C:\Users\MATHIASHA\.cargo\bin" >> $env:GITHUB_PATH

      - name: Extract version from tag
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag -replace '^central-v', ''
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Verify tag actually touches central-server
        shell: pwsh
        run: |
          $prevTag = git describe --tags --abbrev=0 --match "central-v*" "${{ github.ref_name }}^" 2>$null
          if (-not $prevTag) {
            Write-Output "No previous central-v* tag found -- treating this as the first release, nothing to compare against."
            exit 0
          }
          $changed = git diff --name-only "$prevTag" "${{ github.ref_name }}"
          $relevant = $changed | Where-Object { $_ -match '^(central-server/|crates/(domain|application|infrastructure|central-server)/|Cargo\.(toml|lock)$)' }
          if (-not $relevant) {
            Write-Error "Tag ${{ github.ref_name }} does not change anything relevant to central-server since $prevTag -- refusing to build/deploy a no-op release."
            exit 1
          }
          Write-Output "Relevant changes since $prevTag :"
          $relevant | ForEach-Object { Write-Output " - $_" }

      - name: Run tests
        shell: pwsh
        run: |
          cargo check --package central-server
          cargo test --package central-server

      - name: Build Docker image
        shell: pwsh
        run: |
          docker build -f central-server/Dockerfile -t ifascada/central-server:${{ steps.version.outputs.version }} .

      - name: Save image to tar
        shell: pwsh
        run: |
          docker save ifascada/central-server:${{ steps.version.outputs.version }} -o central-server-${{ steps.version.outputs.version }}.tar

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: central-server-${{ steps.version.outputs.version }}.tar

  deploy:
    needs: build
    runs-on: [self-hosted, windows, ifascada]
    environment: production
    steps:
      - name: Download release artifact
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download ${{ github.ref_name }} --pattern "*.tar" --dir .

      - name: Deploy to central host
        shell: pwsh
        run: |
          ./scripts/deploy-docker-service.ps1 `
            -Service "central-server" `
            -TargetHost "192.168.103.154" `
            -SshUser "ifa" `
            -SshKeyPath "$env:USERPROFILE\.ssh\ifascada_ci_deploy" `
            -ImageTarLocalPath "central-server-${{ needs.build.outputs.version }}.tar" `
            -NewImageRef "ifascada/central-server:${{ needs.build.outputs.version }}" `
            -HealthUrl "http://192.168.103.154:8088/health/live"
