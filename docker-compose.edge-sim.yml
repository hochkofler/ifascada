      MQTT_HOST: "ifascada-mosquitto"
      MQTT_PORT: "1883"
      EDGE_BOOTSTRAP_PATH: "/app/config/bootstrap.sim.edge-pack-2.json"
      RUST_LOG: "info"
    networks:
      - scada_net
    volumes:
      - ./crates/edge-agent/config/bootstrap.sim.edge-pack-2.json:/app/config/bootstrap.sim.edge-pack-2.json:ro

  edge-sim-mix-1:
