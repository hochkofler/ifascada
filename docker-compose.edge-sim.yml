      EDGE_BOOTSTRAP_PATH: "/app/config/bootstrap.sim.edge-mix-1.json"
      RUST_LOG: "info"
    networks:
      - scada_net
    volumes:
      - ./crates/edge-agent/config/bootstrap.sim.edge-mix-1.json:/app/config/bootstrap.sim.edge-mix-1.json:ro

  edge-sim-mix-2:
