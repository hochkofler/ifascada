      MQTT_CLIENT_ID: "edge-sim-mix-2"
      MQTT_HOST: "ifascada-mosquitto"
      MQTT_PORT: "1883"
      EDGE_BOOTSTRAP_PATH: "/app/config/bootstrap.sim.edge-mix-2.json"
      RUST_LOG: "info"
    networks:
      - scada_net
    volumes:
      - ./crates/edge-agent/config/bootstrap.sim.edge-mix-2.json:/app/config/bootstrap.sim.edge-mix-2.json:ro

networks:
  scada_net:
    external: true
    name: ifascada_default
