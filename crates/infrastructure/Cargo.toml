[package]
name = "infrastructure"
version = "0.1.0"
edition = "2021"

[dependencies]
domain = { path = "../domain" }
application = { path = "../application" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1"
tracing = "0.1"
rand = "0.8"
dashmap = "5.5"
tokio-modbus = "0.13"
tokio-serial = "5.4"
regex = "1.11"
# We will add database and protocol drivers later (sqlx, tokio-modbus, etc.)
